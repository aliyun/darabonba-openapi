name: Go CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash
    working-directory: golang
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19", "1.20", "1.21"]

    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    # tea-util PR 380 的 Go 产物是 tea-utils/v2 模块，固定到已核对的源码。
    - name: Checkout PrivateLink runtime (tea-util PR 380)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v4
      with:
        repository: Chiosin/tea-util
        ref: 491a1a0fb95acf6593059c5d81867b888f238ea1
        path: .ci-runtime/tea-util
        persist-credentials: false
    - name: Use fixed PrivateLink runtime
      if: github.event_name == 'pull_request'
      run: go mod edit -replace=github.com/alibabacloud-go/tea-utils/v2=../.ci-runtime/tea-util/golang
    - name: Export Env
      run: export GO111MODULE=on
    - name: Build
      run: go mod tidy
    - name: Test
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./client/... ./utils/... ./websocketUtils/...
    - name: Require 90% diff coverage
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
        python3 "${{ github.workspace }}/.github/scripts/require_diff_coverage.py" \
          --base "${{ github.event.pull_request.base.sha }}" \
          --source-root golang \
          --report coverage.txt \
          --format go \
          --minimum 90
    - uses: codecov/codecov-action@v4
      with:
        flags: golang # optional
        token: ${{ secrets.CODECOV_TOKEN }}
