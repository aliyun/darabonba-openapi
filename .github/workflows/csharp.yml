name: C# CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash
    working-directory: csharp/OpenApiClientUnitTests

jobs:
  test:
    runs-on: ubuntu-latest
    name: C# Unit Tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests
      run: dotnet test -f net8.0 --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Require 90% diff coverage
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
        REPORT=$(find TestResults -name coverage.cobertura.xml | head -n 1)
        test -n "$REPORT"
        python3 "${{ github.workspace }}/.github/scripts/require_diff_coverage.py" \
          --base "${{ github.event.pull_request.base.sha }}" \
          --report "$REPORT" \
          --format cobertura \
          --minimum 90

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: csharp/OpenApiClientUnitTests/TestResults/**/coverage.cobertura.xml
        flags: csharp
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
