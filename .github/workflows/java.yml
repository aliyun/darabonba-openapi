# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash
    working-directory: java
jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test against latest update of each major Java version, as well as specific updates of LTS versions:
        java: [8, 11, 17]

    steps:
    - uses: actions/checkout@v4
    - name: Checkout PrivateLink runtime (tea-util PR 380)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v4
      with:
        repository: Chiosin/tea-util
        ref: 491a1a0fb95acf6593059c5d81867b888f238ea1
        path: .ci-runtime/tea-util
        persist-credentials: false
    - name: Set up java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    # 构建前置源码并保留其测试；仅安装唯一 CI 版本到本机，不执行发布。
    - name: Build fixed PrivateLink runtime
      if: github.event_name == 'pull_request'
      run: |
        RUNTIME="${{ github.workspace }}/.ci-runtime/tea-util/java"
        VERSION=0.2.28-oss-private-url-491a1a0
        mvn -f "$RUNTIME/pom.xml" org.codehaus.mojo:versions-maven-plugin:2.16.2:set -B -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        mvn -f "$RUNTIME/pom.xml" package -B
        mvn org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -B -Dfile="$RUNTIME/target/tea-util-$VERSION.jar" -DpomFile="$RUNTIME/pom.xml"
        echo "TEA_UTIL_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Test
      run: mvn test -B "-Dtea-util.version=${TEA_UTIL_VERSION:-0.2.23}"
    - name: Verify JaCoCo report
      run: test -f target/site/jacoco/jacoco.xml
    - name: Require 90% diff coverage
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
        python3 "${{ github.workspace }}/.github/scripts/require_diff_coverage.py" \
          --base "${{ github.event.pull_request.base.sha }}" \
          --source-root java \
          --report target/site/jacoco/jacoco.xml \
          --format jacoco \
          --minimum 90
    - uses: codecov/codecov-action@v4
      with:
        files: java/target/site/jacoco/jacoco.xml
        flags: java
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
