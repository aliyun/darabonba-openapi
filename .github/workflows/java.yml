# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ master, 1.x ]
  pull_request:
    branches: [ master, 1.x ]
defaults:
  run:
    shell: bash
    working-directory: java
jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test against latest update of each major Java version, as well as specific updates of LTS versions:
        java: [8, 11, 17]

    steps:
    - uses: actions/checkout@v2
    - name: Set up java
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
    # TEMP: install the unreleased ipv4Only commits of tea (aliyun/tea-java#255) and tea-util (aliyun/tea-util#378)
    # over the released versions; remove this step and bump the dependencies before merging.
    - name: Install unreleased tea / tea-util
      run: |
        git clone -q https://github.com/aliyun/tea-java.git "$RUNNER_TEMP/tea-java"
        git -C "$RUNNER_TEMP/tea-java" checkout -q 0b1e75b6bfa2dde10bcdb22450d008c39b177925
        git clone -q https://github.com/aliyun/tea-util.git "$RUNNER_TEMP/tea-util"
        git -C "$RUNNER_TEMP/tea-util" checkout -q fa7febe30429371c0ccf203624b392e11ab6e4f6
        OPTS="-q -B install -DskipTests -Dgpg.skip -Djacoco.skip=true -Dmaven.javadoc.skip=true"
        mvn $OPTS -f "$RUNNER_TEMP/tea-java/pom.xml"
        mvn $OPTS -f "$RUNNER_TEMP/tea-util/java/pom.xml"
    - name: Test
      run: mvn test -B
    - uses: codecov/codecov-action@v4
      with:
        flags: java # optional
        token: ${{ secrets.CODECOV_TOKEN }}
