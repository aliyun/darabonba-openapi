# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ master, 1.x ]
  pull_request:
    branches: [ master, 1.x ]
defaults:
  run:
    shell: bash
    working-directory: java
jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test against latest update of each major Java version, as well as specific updates of LTS versions:
        java: [8, 11, 17]

    steps:
    - uses: actions/checkout@v2
    - name: Set up java
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
    # TEMP: install tea until 1.4.3 is on Maven Central (aliyun/tea-java bump #257);
    # remove this step after Central publish.
    - name: Install unreleased tea
      run: |
        git clone -q https://github.com/aliyun/tea-java.git "$RUNNER_TEMP/tea-java"
        git -C "$RUNNER_TEMP/tea-java" checkout -q ede3c12a6f005e634ddc39e758e3c68bdb930003
        OPTS="-q -B install -DskipTests -Dgpg.skip -Djacoco.skip=true -Dmaven.javadoc.skip=true"
        mvn $OPTS -f "$RUNNER_TEMP/tea-java/pom.xml"
    - name: Test
      run: mvn test -B
    - uses: codecov/codecov-action@v4
      with:
        flags: java # optional
        token: ${{ secrets.CODECOV_TOKEN }}
