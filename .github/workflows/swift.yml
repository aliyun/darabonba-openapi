name: Swift CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Test
      run: swift test --enable-code-coverage

    - name: Generate lcov
      run: |
        BIN=$(swift build --show-bin-path)
        TEST_BIN="${BIN}/AlibabacloudOpenApiPackageTests.xctest/Contents/MacOS/AlibabacloudOpenApiPackageTests"
        if [ ! -f "$TEST_BIN" ]; then
          TEST_BIN=$(find "$BIN" -name AlibabacloudOpenApiPackageTests -type f | head -n 1)
        fi
        PROFDATA="${BIN}/codecov/default.profdata"
        if [ ! -f "$PROFDATA" ]; then
          PROFDATA=$(find .build -name default.profdata | head -n 1)
        fi
        xcrun llvm-cov export -format=lcov \
          "$TEST_BIN" \
          -instr-profile "$PROFDATA" \
          -ignore-filename-regex='\.build|Tests' \
          > coverage.lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: swift/coverage.lcov
        flags: swift
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
