name: Swift CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 1a2173ed73554b38700262ce68a5ec4777eeaf05
        path: .swift-ci/tea-swift
        persist-credentials: false

    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Test
      run: swift test

  linux:
    name: Linux Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.6.3-focal", "5.7.3-jammy", "5.8.1-jammy", "5.9.2-jammy", "5.10.1-jammy", "6.0.3-jammy", "6.1.3-jammy", "6.2.4-jammy", "6.3.3-jammy", "6.4.0-jammy"]
    container: swift:${{ matrix.swift }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 1a2173ed73554b38700262ce68a5ec4777eeaf05
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Install Python for older Swift dependency preparation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296 && (startsWith(matrix.swift, '5.6.') || startsWith(matrix.swift, '5.7.'))
      run: apt-get update && apt-get install -y --no-install-recommends python3
    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Swift version
      run: swift --version
    - name: Test
      run: swift test
