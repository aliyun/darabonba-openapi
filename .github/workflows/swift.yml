name: Swift CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false

    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Test
      run: swift test

  linux:
    name: Linux Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.7.3", "5.8.1", "5.9.2", "5.10.1", "6.0.3", "6.1.3", "6.2.4", "6.3.3", "6.4.0"]
    container: swift:${{ matrix.swift }}-jammy
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Install Python for Swift 5.7 dependency preparation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296 && startsWith(matrix.swift, '5.7.')
      run: apt-get update && apt-get install -y --no-install-recommends python3
    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 296
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/swift"
    - name: Swift version
      run: swift --version
    - name: Test
      if: ${{ !startsWith(matrix.swift, '5.7.') }}
      run: swift test
    - name: Verify Swift 5.7 is unsupported on Linux
      if: startsWith(matrix.swift, '5.7.')
      run: |
        if swift test > swift-test.log 2>&1; then
          cat swift-test.log
          exit 1
        fi
        cat swift-test.log
        grep -F "error: Tea on Linux requires Swift 5.8 or later." swift-test.log
