name: Node.js CI

on:
  push:
    branches: [ master ]
   
  pull_request:
    branches: [ master ]
   
defaults:
  run:
    shell: bash
    working-directory: ts
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    # @darabonba/typescript@^1.0.5 on npm includes WebSocket client.
    - run: npm install
    # TEMP: overlay @darabonba/typescript with the unreleased ipv4Only commit (aliyun/tea-typescript#78);
    # remove this step and bump the dependency before merging.
    - name: Use unreleased @darabonba/typescript
      run: |
        git clone -q https://github.com/aliyun/tea-typescript.git "$RUNNER_TEMP/tea-typescript"
        git -C "$RUNNER_TEMP/tea-typescript" checkout -q ad72f91b7f9d86674ab85fadce205ea61bf50188
        (cd "$RUNNER_TEMP/tea-typescript" && npm install && npx tsc)
        rm -rf node_modules/@darabonba/typescript/dist
        cp -R "$RUNNER_TEMP/tea-typescript/dist" node_modules/@darabonba/typescript/dist
    - run: npm run test-cov
    - uses: codecov/codecov-action@v4
      with:
        flags: typescript # optional
        token: ${{ secrets.CODECOV_TOKEN }}
