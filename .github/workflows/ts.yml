name: Node.js CI

on:
  push:
    branches: [ master ]
   
  pull_request:
    branches: [ master ]
   
defaults:
  run:
    shell: bash
    working-directory: ts
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    # Keep @darabonba/typescript@^1.0.5 (npm latest) so install resolves; TEMP overlay
    # supplies ipv4Only until 1.0.6 is published (aliyun/tea-typescript#80). Then bump
    # package.json to ^1.0.6 and remove the overlay step before merging.
    - run: npm install
    # TEMP: overlay unreleased ipv4Only bits; remove after npm 1.0.6.
    - name: Use unreleased @darabonba/typescript
      run: |
        git clone -q https://github.com/aliyun/tea-typescript.git "$RUNNER_TEMP/tea-typescript"
        git -C "$RUNNER_TEMP/tea-typescript" checkout -q 37d97cc5513867cb9f80bd84a99a86b097082c2c
        (cd "$RUNNER_TEMP/tea-typescript" && npm install && npx tsc)
        rm -rf node_modules/@darabonba/typescript/dist
        cp -R "$RUNNER_TEMP/tea-typescript/dist" node_modules/@darabonba/typescript/dist
    - run: npm run test-cov
    - uses: codecov/codecov-action@v4
      with:
        flags: typescript # optional
        token: ${{ secrets.CODECOV_TOKEN }}
